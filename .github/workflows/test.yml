name: Tests

# Every branch but main: main only takes a commit a branch run has tested
on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:

# -NonInteractive makes a missing mandatory parameter an error rather than a prompt, and
# with a custom shell the step's exit code is the script's own, so each script exits with it.

jobs:
  pwsh:
    name: PowerShell 7 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    defaults:
      run:
        shell: pwsh -NonInteractive -NoProfile -Command ". '{0}'"
    steps:
      - uses: actions/checkout@v4

      - name: Show PowerShell version
        run: $PSVersionTable | Format-Table -AutoSize | Out-String -Width 200

      - name: Install Pester 5
        run: |
          $pester = Get-Module -ListAvailable -Name Pester | Where-Object { $_.Version -ge [version]'5.0.0' }
          if (-not $pester) {
              Install-Module -Name Pester -MinimumVersion 5.0.0 -Force -SkipPublisherCheck -Scope CurrentUser -ErrorAction Stop
          }
          Get-Module -ListAvailable -Name Pester | Select-Object Name, Version | Format-Table -AutoSize

      - name: Run tests
        run: |
          ./Tests/Tests-All.ps1 -CodeCoverage:$false -OutputFile TestResults.xml
          exit $LASTEXITCODE

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-pwsh-${{ matrix.os }}
          path: TestResults.xml
          if-no-files-found: ignore

  # Every example in the wiki runs through the module, and a page whose written output differs
  # from what the module writes fails the job, so a change that alters output shows on its push
  wiki-examples:
    name: Wiki examples
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Run the wiki's examples through the module
        shell: pwsh
        run: ./wiki/generate.ps1

      # generate.ps1 also writes the cheat sheet page as the module's help topic, which must be
      # committed as it writes it
      - name: Check the help topic matches the cheat sheet
        run: git diff --exit-code -- en-US

  windows-powershell:
    name: Windows PowerShell 5.1
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: powershell -NonInteractive -NoProfile -Command ". '{0}'"
    steps:
      - uses: actions/checkout@v4

      - name: Show PowerShell version
        run: $PSVersionTable | Format-Table -AutoSize | Out-String -Width 200

      - name: Install Pester 5
        run: |
          $pester = Get-Module -ListAvailable -Name Pester | Where-Object { $_.Version -ge [version]'5.0.0' }
          if (-not $pester) {
              Install-PackageProvider -Name NuGet -MinimumVersion 2.8.5.201 -Force -Scope CurrentUser -ErrorAction Stop | Out-Null
              Install-Module -Name Pester -MinimumVersion 5.0.0 -Force -SkipPublisherCheck -Scope CurrentUser -ErrorAction Stop
          }
          Get-Module -ListAvailable -Name Pester | Select-Object Name, Version | Format-Table -AutoSize

      - name: Run tests
        run: |
          ./Tests/Tests-All.ps1 -CodeCoverage:$false -OutputFile TestResults.xml
          exit $LASTEXITCODE

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-windows-powershell
          path: TestResults.xml
          if-no-files-found: ignore

  # PSScriptAnalyzer runs over the repository in both hosts under the settings file at its root,
  # with the module imported so the analyzer knows its aliases, and any finding fails the job; a
  # script with a known finding is analyzed first, so a run that analyzed nothing fails rather
  # than passing
  analyzer:
    name: Script analysis / ${{ matrix.host }}
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - shell: pwsh
            host: PowerShell 7
          - shell: powershell
            host: Windows PowerShell 5.1
    defaults:
      run:
        shell: ${{ matrix.shell }} -NonInteractive -NoProfile -Command ". '{0}'"
    steps:
      - uses: actions/checkout@v4

      - name: Install PSScriptAnalyzer
        run: |
          $ErrorActionPreference = 'Stop'
          if ($PSVersionTable.PSEdition -eq 'Desktop') {
              Install-PackageProvider -Name NuGet -MinimumVersion 2.8.5.201 -Force -Scope CurrentUser | Out-Null
          }
          Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser

      - name: Analyze the scripts
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module PSScriptAnalyzer
          Import-Module ./PSWriteColorEX.psd1
          $control = Invoke-ScriptAnalyzer -ScriptDefinition 'function Get-Thing { $unused = 1 }' -Settings ./PSScriptAnalyzerSettings.psd1
          if (-not $control) { throw 'The analyzer reported nothing for a script with a known finding' }
          $files = @(Get-ChildItem -Path . -Recurse -File -Include *.ps1, *.psm1, *.psd1)
          $findings = @(Invoke-ScriptAnalyzer -Path . -Recurse -Settings ./PSScriptAnalyzerSettings.psd1)
          $findings | Select-Object RuleName, Severity, ScriptName, Line, Message | Format-Table -AutoSize -Wrap | Out-String -Width 200
          "$($findings.Count) findings in $($files.Count) files, PSScriptAnalyzer $((Get-Module PSScriptAnalyzer).Version)"
          if ($files.Count -eq 0 -or $findings.Count -gt 0) { exit 1 }
