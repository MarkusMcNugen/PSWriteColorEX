# Build and deploy the PSWriteColorEX wiki (Hugo + Hextra) to GitHub Pages.
#
# Adapted from the trex wiki's deploy, which follows the hextra-starter-template pages
# workflow. The Hugo site lives at wiki/. generate.ps1 runs every example on the pages
# through the module first and fails the deploy when a page shows output the module does
# not write; check_highlighting.py then reads the built site for code Chroma could not
# read. Pages must be turned on for the repository, with GitHub Actions as the source.
name: Deploy Wiki

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a run in progress is never canceled, so a deployment always
# completes.
concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.166.0
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v4
      - name: Setup Hugo
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb
      - name: Run the examples through the module
        working-directory: ./wiki
        shell: pwsh
        run: ./generate.ps1
      - name: Build with Hugo
        working-directory: ./wiki
        env:
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production
        run: |
          hugo \
            --gc --minify \
            --baseURL "${{ steps.pages.outputs.base_url }}/"
      - name: Check code highlighting
        working-directory: ./wiki
        run: python3 check_highlighting.py public
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./wiki/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
